<body>
    <h1>Pong</h1>
    <div class="container">
        <div class="left-paddle item"></div>
        <div class="right-paddle item"></div>
        <div class="ball item"></div>
    </div>
    <style>
        .container { position: relative; background: black; color: white; font-family: sans-serif; width: 800px; height: 500px;}
        .item { position: absolute; background-color: white; }
        .left-paddle { width: 10px; height: 80px; left: 20px; }
        .right-paddle { width: 10px; height: 80px; right: 20px; }
        .ball { width: 10px; height: 10px; }
    </style>
    <script>
        let leftY = (500 - 80) / 2;
        let rightY = (500 - 80) / 2;
        let ballY = (500 - 10) / 2;
        let ballX = (800 - 10) / 2;
        let vx = 2;
        let vy = 2;

        const leftP = document.querySelector(".left-paddle");
        const rightP = document.querySelector(".right-paddle");
        const ball = document.querySelector(".ball");

        function draw() {
            leftP.style.transform = `translateY(${leftY}px)`
            rightP.style.transform = `translateY(${rightY}px)`
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`
        }

        function loop() {
            ballX += vx;
            ballY += vy;
            if (ballY < 0 || ballY > (500 -10 )) {vy *= -1}
            if (ballX < 0 || ballX > (800 - 10)) {
                ballY = (500 - 10) / 2;
                ballX = (800 - 10) / 2;
            }

            if (ballX + 10 > 20 && ballX < 30 && ballY + 10 > leftY && ballY < leftY + 80) {
                vx *= -1
            }
            if (ballX + 10 > 770 && ballX < 780 && ballY + 10 > rightY && ballY < rightY + 80) {
                vx *= -1
            }
            draw()
            requestAnimationFrame(loop)
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'w') {
                leftY -= 10;
            }
            if (event.key === 's') {
                leftY += 10;
            }
            if (event.key === 'ArrowUp') {
                rightY -= 10;
            }
            if (event.key === 'ArrowDown') {
                rightY += 10;
            }
        });

        loop()
    </script>
</body>
