<body>
    <h1>Pong</h1>
    <div class="container">
        <div class="left-paddle item"></div>
        <div class="right-paddle item"></div>
        <div class="ball item"></div>
        <p>0 : 0</p>

    </div>
    <style>
        body {display: grid; place-items: center;}
        .container { position: relative; background: black; color: white; font-family: sans-serif; width: 800px; height: 500px;}
        .item { position: absolute; background-color: white; }
        .left-paddle { width: 10px; height: 80px; left: 20px; }
        .right-paddle { width: 10px; height: 80px; right: 20px; }
        .ball { width: 10px; height: 10px; }
        p { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 30px;}
        
    </style>
    <script>
        let leftY = (500 - 80) / 2;
        let rightY = (500 - 80) / 2;
        let ballY = (500 - 10) / 2;
        let ballX = (800 - 10) / 2;
        let vx = 2;
        let vy = 2;
        let sc1 = 0;
        let sc2 = 0;
        const keys = {}

        const leftP = document.querySelector(".left-paddle");
        const rightP = document.querySelector(".right-paddle");
        const ball = document.querySelector(".ball");
        const score = document.querySelector('p')

        function draw() {
            leftP.style.transform = `translateY(${leftY}px)`
            rightP.style.transform = `translateY(${rightY}px)`
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`
            score.textContent = `${sc1} : ${sc2}`
        }

        function loop() {

            if (keys['w']) {leftY -= 2}
            if (keys['s']) {leftY += 2}
            if (keys['ArrowUp']) (rightY -= 2)
            if (keys['ArrowDown']) (rightY += 2)

            if (leftY < 0) {leftY = 0}
            if (leftY > (500 - 80)) {leftY = (500 - 80)}
            if (rightY < 0) {rightY = 0}
            if (rightY > (500 - 80)) {rightY = (500 - 80)} 


            ballX += vx;
            ballY += vy;
            if (ballY < 0 || ballY > (500 -10 )) {vy *= -1}
            if (ballX < 0) {
                ballY = (500 - 10) / 2;
                ballX = (800 - 10) / 2;
                vx *= -1;
                sc2 += 1; 
            }
            
            if (ballX > (800 - 10)) {
                ballY = (500 - 10) / 2;
                ballX = (800 - 10) / 2;
                vx *= -1;
                sc1 += 1;
            }

            if (ballX + 10 > 20 && ballX < 30 && ballY + 10 > leftY && ballY < leftY + 80) {
                vx *= -1
                ballX = 30;
            }
            if (ballX + 10 > 770 && ballX < 780 && ballY + 10 > rightY && ballY < rightY + 80) {
                vx *= -1
                ballX = 760;
            }
            draw()
            requestAnimationFrame(loop)
        }



        document.addEventListener('keydown', (event) => {
            keys[event.key] = true;
            if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                event.preventDefault()
            }
        })

        document.addEventListener('keyup', (event) => {
            keys[event.key] = false;
        })

        loop()
    </script>
</body>
