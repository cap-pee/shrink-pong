<body>
    <h1>Pong</h1>
    <div class="container">
        <div class="left-paddle item"></div>
        <div class="right-paddle item"></div>
        <div class="ball item"></div>
        <p>0     0</p>
        <button class="mute">SOUND</button>

    </div>
    <style>
        body {display: grid; place-items: center; align-content: center; background: #d6e0f0; min-height: 100vh; margin: 0; color: #2b3547; }
        .container { position: relative; background: #2f3a4f; color: #eef3fa; font-family: sans-serif; width: 800px; height: 500px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
        .item { position: absolute; background-color: #eef3fa; }
        .left-paddle { width: 10px; height: 80px; left: 20px; border-radius: 2px; }
        .right-paddle { width: 10px; height: 80px; right: 20px; border-radius: 2px; }
        .ball { width: 10px; height: 10px; border-radius: 50%; }
        p { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 30px; opacity: 0.6; white-space: pre;}
        .mute { position: absolute; top: 10px; right: 10px; background: transparent; color: #eef3fa; font-family: inherit; border: 2px solid #eef3fa; border-radius: 6px; opacity: 0.6; padding: 4px 10px; font-size: 14px; cursor: pointer; transition: opacity 0.2s;}
        .mute:hover{ opacity: 1; }
        .mute.off { opacity: 0.3; text-decoration: line-through; }
        h1 { font-size: 60px; }
        /* dashed line */
        .container::before { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px dashed #eef3fa; opacity: 0.3; content: ''; margin-left: -1px;}
    </style>
    <script>
        let leftY = (500 - 80) / 2;
        let rightY = (500 - 80) / 2;
        let ballY = (500 - 10) / 2;
        let ballX = (800 - 10) / 2;
        let vx = 2;
        let vy = 2;
        let sc1 = 0;
        let sc2 = 0;
        let paddleSpeed = 2
        let mute = false
        const keys = {}

        let sound = new AudioContext()

        function beep(freq, duration) {
            if (mute) return;
            let osc = sound.createOscillator();
            let gain = sound.createGain();

            osc.frequency.value = freq;
            osc.type = 'square';
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(sound.destination);
            osc.start();
            osc.stop(sound.currentTime + duration);
        }

        const leftP = document.querySelector(".left-paddle");
        const rightP = document.querySelector(".right-paddle");
        const ball = document.querySelector(".ball");
        const score = document.querySelector('p')
        const buttonM = document.querySelector('.mute')

        function draw() {
            leftP.style.transform = `translateY(${leftY}px)`
            rightP.style.transform = `translateY(${rightY}px)`
            ball.style.transform = `translate(${ballX}px, ${ballY}px)`
            score.textContent = `${sc1}     ${sc2}`
        }

        function reset() {
            ballY = (500 - 10) / 2;
            ballX = (800 - 10) / 2;

            let direction = Math.random() < 0.5 ? 1 : -1
            let size = 1 + Math.random()
            vy = direction * size
            vx = Math.sign(vx) * -1 * 2
            paddleSpeed = 2
            beep(150, 0.3);
        }

        function speedUp() {
            if (Math.abs(vx) < 6) {
                vx *= -1.05
                paddleSpeed *= 1.05
            } else {
                vx *= -1
            }
        }

        function loop() {

            if (keys['w']) {leftY -= paddleSpeed}
            if (keys['s']) {leftY += paddleSpeed}
            if (keys['arrowup']) {rightY -= paddleSpeed}
            if (keys['arrowdown']) {rightY += paddleSpeed}

            if (leftY < 0) {leftY = 0}
            if (leftY > (500 - 80)) {leftY = (500 - 80)}
            if (rightY < 0) {rightY = 0}
            if (rightY > (500 - 80)) {rightY = (500 - 80)} 


            ballX += vx;
            ballY += vy;
            if (ballY < 0 || ballY > (500 -10 )) {
                vy *= -1
                beep(220, 0.05);
            }
            if (ballX < 0) {
                reset()
                sc2 += 1;
            }
            
            if (ballX > (800 - 10)) {
                reset()
                sc1 += 1;
            }

            if (ballX + 10 > 20 && ballX < 30 && ballY + 10 > leftY && ballY < leftY + 80) {
                speedUp()

                ballX = 30;
                beep(440, 0.08);
            }
            if (ballX + 10 > 770 && ballX < 780 && ballY + 10 > rightY && ballY < rightY + 80) {
                speedUp()

                ballX = 760;
                beep(440, 0.08);
            }
            draw()
            requestAnimationFrame(loop)
        }


        buttonM.addEventListener('click', () => {
            mute = !mute
            buttonM.classList.toggle('off')
        }
        )

        document.addEventListener('keydown', (event) => {
            sound.resume()
            keys[event.key.toLowerCase()] = true;
            if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                event.preventDefault()
            }
        })

        document.addEventListener('keyup', (event) => {
            keys[event.key.toLowerCase()] = false;
        })

        loop()
    </script>
</body>
